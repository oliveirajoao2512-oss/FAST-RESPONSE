# Uso: cp .env.example .env  (preencha POSTGRES_PASSWORD, ADMIN_EMAIL e ADMIN_PASSWORD)
#      docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fastresponse
      POSTGRES_USER: fastresponse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastresponse -d fastresponse"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # EXTERNAL_DATABASE_URL (ex.: Supabase) substitui o banco do próprio compose
      DATABASE_URL: ${EXTERNAL_DATABASE_URL:-postgresql://fastresponse:${POSTGRES_PASSWORD}@db:5432/fastresponse}
      UPLOAD_DIR: /data/uploads
    ports:
      - "${HTTP_PORT:-3000}:3000"
    volumes:
      - uploads:/data

volumes:
  pgdata:
  uploads:
