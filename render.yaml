# Render Blueprint: New → Blueprint → escolha este repositório.
# Plano gratuito: banco no Supabase (Session pooler) e anexos no Supabase Storage (o plano gratuito não tem disco).
# Para não hibernar após 15 min sem acesso, configure um monitor gratuito chamando /api/health a cada 5–10 min
# (passo a passo em docs/IMPLANTACAO.md, seção 10).
services:
  - type: web
    name: fast-response
    runtime: docker
    plan: free
    region: ohio             # mesma região do projeto Supabase (us-east-2)
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # string do Supabase (Session pooler) com sslmode/sslrootcert, ver docs
      - key: SUPABASE_URL
        sync: false          # https://<ref>.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false          # Supabase → Settings → API Keys → Secret key
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador
      - key: APP_URL
        sync: false          # ex.: https://fast-response.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: TZ
        value: America/Sao_Paulo
